name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightflux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lightflux/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Export desktop web assets
        run: npm run desktop:web

  release:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis
          - name: Linux x86_64
            platform: ubuntu-22.04
            rustTargets: ""
            args: --bundles appimage,deb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lightflux/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: lightflux/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: lightflux
        run: npm ci

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIGHTFLUX_UPDATER_PUBLIC_KEY: ${{ vars.LIGHTFLUX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: lightflux
          owner: little1d
          repo: LightFlux
          releaseCommitish: main
          tagName: desktop-v__VERSION__
          releaseName: LightFlux Desktop v__VERSION__
          releaseBody: Download the installer for your desktop platform from the assets below.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: ${{ vars.LIGHTFLUX_UPDATER_ENABLED == 'true' }}
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  publish:
    name: Validate and publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate updater manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r '.version' lightflux/src-tauri/tauri.conf.json)"
          TAG="desktop-v${VERSION}"
          RELEASE_DIR="${RUNNER_TEMP}/lightflux-release"
          mkdir -p "${RELEASE_DIR}"
          gh release download "${TAG}" \
            --repo little1d/LightFlux \
            --pattern latest.json \
            --dir "${RELEASE_DIR}" \
            --clobber
          jq -e '
            .version == "'"${VERSION}"'" and
            (.platforms["windows-x86_64"].signature | length > 0) and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            (.platforms["darwin-x86_64"].signature | length > 0) and
            (.platforms["linux-x86_64"].signature | length > 0)
          ' "${RELEASE_DIR}/latest.json"
          gh release edit "${TAG}" \
            --repo little1d/LightFlux \
            --draft=false \
            --latest
