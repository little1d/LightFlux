# LightFlux API — nginx reverse proxy.
#
# Place at /etc/nginx/conf.d/lightflux.conf on the server.
#
# This is the HTTP-only starting point. Run certbot to obtain the TLS
# certificate and let it inject the `listen 443 ssl`, certificate paths, and
# the HTTP->HTTPS redirect:
#
#   certbot --nginx -d lightflux.site -d www.lightflux.site \
#     --agree-tos --redirect -m you@example.com
#
# After certbot runs, this file gains a `listen 443 ssl` server block and the
# port-80 block returns a 301 redirect to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name lightflux.site www.lightflux.site;

    # Matches MAX_UPLOAD_BYTES (8 MiB) with headroom for multipart overhead.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
