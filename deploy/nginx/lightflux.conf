# LightFlux — nginx config (static Web app + API reverse proxy).
#
# Place at /etc/nginx/conf.d/lightflux.conf on the server.
#
# This is the HTTP-only starting point. Run certbot to obtain the TLS
# certificate and let it inject the `listen 443 ssl`, certificate paths, and
# the HTTP->HTTPS redirect:
#
#   certbot --nginx -d lightflux.site -d www.lightflux.site \
#     --agree-tos --redirect -m you@example.com
#
# Layout on the server:
#   /opt/lightflux/web        # exported Expo web app (SPA)
#   127.0.0.1:8787            # API container (docker compose)
#
# The SPA is served from the web root with a history-fallback to index.html.
# API traffic (/api/*) and the health check (/health) are reverse-proxied to
# the container; everything else resolves to the single-page app.

server {
    listen 80;
    listen [::]:80;
    server_name lightflux.site www.lightflux.site;

    # Exported Expo web bundle (see deploy/scripts/deploy-web.sh).
    root /opt/lightflux/web;
    index index.html;

    # Matches MAX_UPLOAD_BYTES (8 MiB) with headroom for multipart overhead.
    client_max_body_size 10m;

    # API reverse proxy.
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Long-cache the fingerprinted Expo assets.
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
